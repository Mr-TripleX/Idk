<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutalist Habit Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        :root {
            /* Nền Dark Xám */
            --bg: #121212;
            --surface: #1e1e1e;
            
            /* Chữ */
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            
            /* Color Theory: Neon Accents cho Brutalism */
            --border: #52525b;       /* Xám viền dày */
            --accent-cyan: #06b6d4;  /* Xanh lơ */
            --accent-pink: #ec4899;  /* Hồng đậm */
            --accent-yellow: #eab308;/* Vàng */
            --accent-green: #22c55e; /* Xanh lá (Hoàn thành) */
            --danger: #ef4444;       /* Đỏ */
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }

        h1, h2, h3 { 
            text-transform: uppercase; 
            margin-top: 0; 
            letter-spacing: 1px;
        }

        /* Bố cục Grid 2 cột lấp đầy không gian */
        .layout-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: start;
        }

        /* Thẻ Card Brutalism - Vuông vức, bóng cứng, viền dày */
        .card {
            background: var(--surface);
            border: 3px solid var(--text-main);
            padding: 24px;
            position: relative;
        }
        
        /* Chơi màu cho từng Card để bớt nhàm chán */
        .card-habit { box-shadow: 8px 8px 0px var(--accent-cyan); }
        .card-custom-stats { box-shadow: 8px 8px 0px var(--accent-pink); }
        .card-weekly-stats { box-shadow: 8px 8px 0px var(--accent-yellow); }
        .card-todo { box-shadow: 8px 8px 0px var(--accent-green); }

        /* Bảng */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border: 3px solid var(--text-main);
        }
        th, td {
            border: 2px solid var(--border);
            padding: 12px;
            text-align: center;
        }
        th { 
            background-color: var(--border); 
            color: var(--text-main);
            text-transform: uppercase;
        }
        .text-left { text-align: left; }

        /* Input & Nút bấm Brutalism */
        input[type="text"], input[type="date"] {
            padding: 10px;
            background-color: var(--bg);
            color: var(--text-main);
            border: 2px solid var(--text-main);
            outline: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
        }
        input[type="text"]:focus, input[type="date"]:focus {
            background-color: var(--border);
        }

        button {
            padding: 10px 16px;
            background-color: var(--text-main);
            color: var(--bg);
            border: 2px solid var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border);
        }
        
        /* Phối màu nút bấm */
        .btn-cyan { background: var(--accent-cyan); color: #000; border-color: #000; box-shadow: 4px 4px 0px #000; }
        .btn-pink { background: var(--accent-pink); color: #fff; border-color: #fff; box-shadow: 4px 4px 0px #fff; }
        .btn-danger { background: var(--danger); color: #fff; border-color: #fff; box-shadow: 3px 3px 0px #000; padding: 6px 10px; font-size: 12px;}

        /* Custom Checkbox Brutalism */
        .brutal-checkbox {
            appearance: none;
            width: 28px;
            height: 28px;
            border: 2px solid var(--text-main);
            background: var(--bg);
            cursor: pointer;
            position: relative;
        }
        .brutal-checkbox:checked {
            background: var(--accent-green);
        }
        .brutal-checkbox:checked::after {
            content: '✔';
            position: absolute;
            color: #000;
            font-weight: 900;
            font-size: 18px;
            left: 5px;
            top: 2px;
        }

        /* Header Điều khiển tuần */
        .week-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            border: 2px solid var(--text-main);
            background: var(--border);
        }
        .week-controls span { font-weight: bold; font-size: 1.2em; text-transform: uppercase; }

        /* Biểu đồ Donut cho Tuần */
        .stats-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 15px;}
        .stat-item { width: 100px; text-align: center; }
        .donut-chart {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-yellow) var(--p, 0%), var(--bg) 0);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 10px; position: relative;
            border: 2px solid var(--text-main);
        }
        .donut-chart::before {
            content: ""; position: absolute;
            width: 50px; height: 50px;
            background: var(--surface); border-radius: 50%;
            border: 2px solid var(--text-main);
        }
        .donut-chart span { position: relative; font-weight: 700; color: var(--text-main); }
        
        /* Thanh tiến trình cho Custom Range */
        .progress-block { margin-bottom: 15px; }
        .progress-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .progress-bar {
            width: 100%; height: 24px;
            border: 2px solid var(--text-main);
            background: var(--bg);
            position: relative;
        }
        .progress-fill {
            height: 100%; background: var(--accent-pink);
            border-right: 2px solid var(--text-main);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .layout-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<h1 style="text-align: center; font-size: 2.5em; margin-bottom: 30px; text-shadow: 4px 4px 0px var(--accent-cyan);">
    ⚡ HỆ THỐNG QUẢN LÝ CÁ NHÂN
</h1>

<div class="layout-grid">
    <!-- CỘT TRÁI: LỊCH CHỈ TIÊU -->
    <div class="left-col">
        <div class="card card-habit">
            <h2>Lịch Theo Dõi Chỉ Tiêu</h2>
            <div class="week-controls">
                <button class="btn-cyan" onclick="changeWeek(-1)">&#8592; Tuần trước</button>
                <span id="weekDisplay">Tuần: ...</span>
                <button class="btn-cyan" onclick="changeWeek(1)">Tuần sau &#8594;</button>
            </div>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="habitInput" placeholder="Tên chỉ tiêu mới..." style="flex: 1;">
                <button class="btn-cyan" onclick="addHabit()">Thêm</button>
            </div>

            <div style="overflow-x: auto;">
                <table id="habitTable">
                    <thead>
                        <tr id="habitHead">
                            <th class="text-left" style="width: 250px;">Chỉ tiêu</th>
                        </tr>
                    </thead>
                    <tbody id="habitBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- CỘT PHẢI: THỐNG KÊ & TO-DO -->
    <div class="right-col" style="display: flex; flex-direction: column; gap: 30px;">
        
        <!-- THỐNG KÊ TÙY CHỈNH (MỚI) -->
        <div class="card card-custom-stats">
            <h2>Thống kê theo giai đoạn</h2>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <label style="width: 40px;">Từ:</label>
                    <input type="date" id="customStart" style="flex: 1;">
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <label style="width: 40px;">Đến:</label>
                    <input type="date" id="customEnd" style="flex: 1;">
                </div>
                <button class="btn-pink" onclick="calculateCustomStats()" style="width: 100%;">Tính Toán %</button>
            </div>
            <div id="customStatsResult">
                <p style="color: var(--text-muted); text-align: center; font-style: italic;">Nhập ngày và bấm tính toán...</p>
            </div>
        </div>

        <!-- THỐNG KÊ TUẦN NÀY -->
        <div class="card card-weekly-stats">
            <h2>Hiệu suất tuần này</h2>
            <div class="stats-grid" id="weeklyStatsContainer">
            </div>
        </div>

        <!-- TO-DO LIST -->
        <div class="card card-todo">
            <h2>Việc Cần Làm</h2>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="todoTask" placeholder="Tên công việc...">
                <input type="text" id="todoNote" placeholder="Ghi chú (Tùy chọn)...">
                <button onclick="addTodo()" style="background: var(--accent-green); color: #000;">Thêm Việc</button>
            </div>
            
            <table style="margin-top: 0;">
                <thead>
                    <tr>
                        <th class="text-left">Việc</th>
                        <th>Xong</th>
                        <th>Xóa</th>
                    </tr>
                </thead>
                <tbody id="todoBody">
                </tbody>
            </table>
        </div>

    </div>
</div>

<script>
    // --- DỮ LIỆU ---
    let currentStartOfWeek = getStartOfWeek(new Date());
    let habits = JSON.parse(localStorage.getItem('habits')) || [];
    let habitRecords = JSON.parse(localStorage.getItem('habitRecords')) || {}; 
    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    // --- HÀM HỖ TRỢ ---
    function getStartOfWeek(date) {
        let d = new Date(date);
        let day = d.getDay();
        let diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    function formatDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    function getDayName(date) {
        const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        return days[date.getDay()];
    }

    function changeWeek(offset) {
        currentStartOfWeek.setDate(currentStartOfWeek.getDate() + (offset * 7));
        renderApp();
    }

    // --- HABIT TRACKER ---
    function addHabit() {
        const input = document.getElementById('habitInput');
        if (input.value.trim()) {
            habits.push({ id: Date.now().toString(), name: input.value.trim() });
            input.value = '';
            saveData();
            renderApp();
        }
    }

    function removeHabit(id) {
        if(confirm("Xóa chỉ tiêu này?")) {
            habits = habits.filter(h => h.id !== id);
            saveData();
            renderApp();
        }
    }

    function toggleHabit(habitId, dateStr) {
        const key = `${habitId}_${dateStr}`;
        habitRecords[key] = !habitRecords[key];
        saveData();
        renderWeeklyStats();
        // Nếu bảng custom stat đang có kết quả thì cập nhật luôn
        if(document.getElementById('customStart').value) calculateCustomStats();
    }

    // --- TO-DO LIST ---
    function addTodo() {
        const taskInput = document.getElementById('todoTask');
        const noteInput = document.getElementById('todoNote');
        if (taskInput.value.trim()) {
            todos.push({
                id: Date.now().toString(),
                task: taskInput.value.trim(),
                note: noteInput.value.trim(),
                done: false
            });
            taskInput.value = '';
            noteInput.value = '';
            saveData();
            renderTodos();
        }
    }

    function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
        if (todo) { todo.done = !todo.done; saveData(); renderTodos(); }
    }

    function removeTodo(id) {
        todos = todos.filter(t => t.id !== id);
        saveData();
        renderTodos();
    }

    function saveData() {
        localStorage.setItem('habits', JSON.stringify(habits));
        localStorage.setItem('habitRecords', JSON.stringify(habitRecords));
        localStorage.setItem('todos', JSON.stringify(todos));
    }

    // --- TÍNH TOÁN THEO GIAI ĐOẠN TÙY CHỈNH ---
    function calculateCustomStats() {
        const startVal = document.getElementById('customStart').value;
        const endVal = document.getElementById('customEnd').value;
        const container = document.getElementById('customStatsResult');

        if (!startVal || !endVal) {
            container.innerHTML = '<p style="color: var(--danger); font-weight: bold;">[!] Vui lòng chọn đủ 2 mốc ngày.</p>';
            return;
        }

        const startDate = new Date(startVal);
        const endDate = new Date(endVal);

        if (startDate > endDate) {
            container.innerHTML = '<p style="color: var(--danger); font-weight: bold;">[!] Ngày bắt đầu phải trước ngày kết thúc.</p>';
            return;
        }

        if (habits.length === 0) {
            container.innerHTML = '<p>Chưa có chỉ tiêu nào.</p>';
            return;
        }

        // Lấy danh sách chuỗi ngày
        let dates = [];
        let current = new Date(startDate);
        while (current <= endDate) {
            dates.push(formatDate(current));
            current.setDate(current.getDate() + 1);
        }
        
        const totalDays = dates.length;
        let html = '';

        habits.forEach(habit => {
            let doneCount = 0;
            dates.forEach(dStr => {
                if (habitRecords[`${habit.id}_${dStr}`]) doneCount++;
            });
            let percent = Math.round((doneCount / totalDays) * 100);
            
            // Thanh Progress Bar phong cách Brutalism
            html += `
            <div class="progress-block">
                <div class="progress-header">
                    <span>${habit.name}</span>
                    <span>${percent}% (${doneCount}/${totalDays})</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${percent}%;"></div>
                </div>
            </div>`;
        });
        
        container.innerHTML = html;
    }

    // --- RENDER GIAO DIỆN ---
    function renderApp() {
        renderCalendar();
        renderWeeklyStats();
        renderTodos();
    }

    function renderCalendar() {
        let endOfWeek = new Date(currentStartOfWeek);
        endOfWeek.setDate(currentStartOfWeek.getDate() + 6);
        document.getElementById('weekDisplay').innerText = 
            `${currentStartOfWeek.toLocaleDateString('vi-VN')} - ${endOfWeek.toLocaleDateString('vi-VN')}`;

        const thead = document.getElementById('habitHead');
        thead.innerHTML = '<th class="text-left" style="width: 250px;">Chỉ tiêu</th>';
        
        let weekDates = [];
        for (let i = 0; i < 7; i++) {
            let d = new Date(currentStartOfWeek);
            d.setDate(currentStartOfWeek.getDate() + i);
            weekDates.push(d);
            thead.innerHTML += `<th>${getDayName(d)}<br><small style="color: var(--accent-cyan); font-weight: bold;">${d.getDate()}/${d.getMonth()+1}</small></th>`;
        }

        const tbody = document.getElementById('habitBody');
        tbody.innerHTML = '';
        
        if (habits.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="color: var(--text-muted);">Trống! Hãy thêm mục tiêu.</td></tr>`;
        }

        habits.forEach(habit => {
            let tr = document.createElement('tr');
            
            let tdName = document.createElement('td');
            tdName.className = 'text-left';
            tdName.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; font-weight: bold;">
                    <span>${habit.name}</span>
                    <button class="btn-danger" onclick="removeHabit('${habit.id}')">X</button>
                </div>
            `;
            tr.appendChild(tdName);

            weekDates.forEach(date => {
                let td = document.createElement('td');
                let dateStr = formatDate(date);
                let key = `${habit.id}_${dateStr}`;
                let isChecked = habitRecords[key] ? 'checked' : '';
                
                td.innerHTML = `<input type="checkbox" class="brutal-checkbox" ${isChecked} onchange="toggleHabit('${habit.id}', '${dateStr}')">`;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    function renderWeeklyStats() {
        const container = document.getElementById('weeklyStatsContainer');
        container.innerHTML = '';
        if (habits.length === 0) return;

        let weekDatesStr = [];
        for (let i = 0; i < 7; i++) {
            let d = new Date(currentStartOfWeek);
            d.setDate(currentStartOfWeek.getDate() + i);
            weekDatesStr.push(formatDate(d));
        }

        habits.forEach(habit => {
            let doneCount = 0;
            weekDatesStr.forEach(dateStr => {
                if (habitRecords[`${habit.id}_${dateStr}`]) doneCount++;
            });

            let percentage = Math.round((doneCount / 7) * 100);
            
            container.innerHTML += `
                <div class="stat-item">
                    <div class="donut-chart" style="--p: ${percentage}%">
                        <span>${percentage}%</span>
                    </div>
                    <div style="font-weight: bold; font-size: 0.9em; line-height: 1.2;">${habit.name}</div>
                </div>
            `;
        });
    }

    function renderTodos() {
        const tbody = document.getElementById('todoBody');
        tbody.innerHTML = '';

        if (todos.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="color: var(--text-muted);">Bạn rảnh rỗi!</td></tr>`;
        }

        todos.forEach(todo => {
            let tr = document.createElement('tr');
            let textStyle = todo.done ? 'text-decoration: line-through; color: var(--text-muted); opacity: 0.5;' : 'font-weight: bold;';
            let noteHtml = todo.note ? `<div style="font-size: 12px; color: var(--accent-yellow); margin-top: 4px; font-weight: normal;">>> ${todo.note}</div>` : '';
            
            tr.innerHTML = `
                <td class="text-left" style="${textStyle}">
                    ${todo.task}
                    ${noteHtml}
                </td>
                <td>
                    <input type="checkbox" class="brutal-checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo('${todo.id}')">
                </td>
                <td>
                    <button class="btn-danger" onclick="removeTodo('${todo.id}')">Xóa</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    renderApp();
</script>

</body>
</html>
