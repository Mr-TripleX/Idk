<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro-Futuristic Habit Tracker</title>
    <!-- Font chữ kỹ thuật số hoài cổ -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette từ image_096c57.png */
            --ashes: #B7B4AE;
            --light-charcoal: #726E68;
            --dryad-bark: #33312F;
            --black-kite: #371E1E;
            --existential-angst: #0A0A0A;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--existential-angst);
            color: var(--ashes);
            margin: 0;
            padding: 30px;
            /* Hiệu ứng lưới Grid nền của Retro-Futurism */
            background-image: 
                linear-gradient(rgba(114, 110, 104, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(114, 110, 104, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            min-height: 100vh;
        }

        h1, h2, h3 {
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(183, 180, 174, 0.3);
            margin-top: 0;
        }

        h1 { text-align: center; font-size: 2.8em; margin-bottom: 30px; color: var(--ashes); }

        /* Bố cục chính */
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .bottom-section {
            display: grid;
            grid-template-columns: 1fr 1.8fr; /* Todo list chiếm phần lớn hơn */
            gap: 25px;
            align-items: start;
        }

        /* Thẻ nội dung (Cards) - Bo góc nhẹ, nền Dryad Bark */
        .panel {
            background-color: var(--dryad-bark);
            border: 1px solid var(--light-charcoal);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(183, 180, 174, 0.03);
            backdrop-filter: blur(4px);
        }

        .todo-panel {
            display: flex;
            flex-direction: column;
            min-height: 500px; /* Fill dài ra */
        }

        /* Nút bấm */
        button {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--light-charcoal);
            background-color: var(--black-kite);
            color: var(--ashes);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(55, 30, 30, 0.5);
        }
        button:hover {
            border-color: var(--ashes);
            box-shadow: 0 0 15px rgba(183, 180, 174, 0.4);
            text-shadow: 0 0 5px var(--ashes);
        }
        button.btn-danger {
            background-color: transparent;
            border: 1px solid var(--light-charcoal);
            color: var(--light-charcoal);
            padding: 6px 12px;
            font-size: 14px;
        }
        button.btn-danger:hover {
            border-color: var(--black-kite);
            color: var(--ashes);
            background-color: var(--black-kite);
        }

        /* Inputs */
        input[type="text"], input[type="date"] {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 500;
            padding: 10px 15px;
            background-color: var(--existential-angst);
            border: 1px solid var(--light-charcoal);
            color: var(--ashes);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            border-color: var(--ashes);
            box-shadow: 0 0 10px rgba(183, 180, 174, 0.2);
        }
        input::placeholder { color: var(--light-charcoal); }

        /* --- BẢNG HABIT TRACKER --- */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(10, 10, 10, 0.4);
            border-radius: 8px;
            border: 1px solid rgba(114, 110, 104, 0.3);
        }
        #weekDisplay { font-size: 1.4em; font-weight: 700; color: var(--ashes); letter-spacing: 1px;}
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid var(--light-charcoal);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(114, 110, 104, 0.3);
            border-right: 1px solid rgba(114, 110, 104, 0.3);
        }
        th { background-color: rgba(10, 10, 10, 0.6); font-size: 1.1em; color: var(--ashes); }
        td:last-child, th:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }
        .text-left { text-align: left; }

        /* Custom Checkbox Retro */
        .retro-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--light-charcoal);
            border-radius: 6px;
            background: var(--existential-angst);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .retro-checkbox:checked {
            background: var(--black-kite);
            border-color: var(--ashes);
            box-shadow: 0 0 10px rgba(183, 180, 174, 0.3);
        }
        .retro-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: var(--ashes);
            font-size: 18px;
            font-weight: bold;
            left: 4px;
            top: 0px;
        }

        /* --- THỐNG KÊ --- */
        .stats-wrapper { display: flex; flex-direction: column; gap: 20px; }
        .stats-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .stat-item { text-align: center; }
        
        .donut-chart {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: conic-gradient(var(--black-kite) var(--p, 0%), var(--existential-angst) 0);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 10px;
            position: relative;
            border: 1px solid var(--light-charcoal);
            box-shadow: 0 0 10px rgba(55, 30, 30, 0.3);
        }
        .donut-chart::before {
            content: ""; position: absolute;
            width: 50px; height: 50px;
            background: var(--dryad-bark);
            border-radius: 50%;
            border: 1px solid var(--light-charcoal);
        }
        .donut-chart span { position: relative; font-weight: 700; font-size: 1.1em;}

        .progress-block { margin-bottom: 12px; }
        .progress-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 5px; font-size: 1.1em;}
        .progress-bar {
            width: 100%; height: 14px;
            background: var(--existential-angst);
            border: 1px solid var(--light-charcoal);
            border-radius: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--black-kite);
            box-shadow: 0 0 10px rgba(183, 180, 174, 0.2);
            transition: width 0.5s ease-out;
        }

        /* --- TO-DO LIST ĐƯỢC MỞ RỘNG --- */
        .todo-input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--light-charcoal);
        }
        
        .todo-list-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 500px;
            padding-right: 10px;
        }

        /* Thanh trượt (Scrollbar) phong cách retro */
        .todo-list-container::-webkit-scrollbar { width: 6px; }
        .todo-list-container::-webkit-scrollbar-track { background: var(--existential-angst); border-radius: 4px; }
        .todo-list-container::-webkit-scrollbar-thumb { background: var(--light-charcoal); border-radius: 4px; }

        .todo-item {
            display: flex;
            align-items: center;
            background: rgba(10, 10, 10, 0.5);
            border: 1px solid var(--light-charcoal);
            padding: 15px 20px;
            border-radius: 10px;
            gap: 20px;
            transition: background 0.2s;
        }
        .todo-item:hover { background: rgba(55, 30, 30, 0.2); border-color: var(--ashes); }
        .todo-item.done { opacity: 0.6; }
        .todo-item.done .todo-text { text-decoration: line-through; color: var(--light-charcoal); }

        .todo-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .todo-text { font-size: 1.3em; font-weight: 600; color: var(--ashes); }
        .todo-note { font-size: 1em; color: var(--light-charcoal); }

        @media (max-width: 1024px) {
            .bottom-section { grid-template-columns: 1fr; }
            .todo-input-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>TERMINAL // SYSTEM_TRACKER</h1>

    <!-- HÀNG TRÊN: LỊCH CHỈ TIÊU -->
    <div class="panel">
        <h2>Lịch Theo Dõi Chỉ Tiêu</h2>
        
        <div class="controls-row">
            <button onclick="changeWeek(-1)">&#9664; Tuần trước</button>
            <span id="weekDisplay">Tuần: ...</span>
            <button onclick="changeWeek(1)">Tuần sau &#9654;</button>
        </div>
        
        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
            <input type="text" id="habitInput" placeholder="Khởi tạo mục tiêu mới..." style="flex: 1; max-width: 400px;">
            <button onclick="addHabit()">THÊM MỤC TIÊU</button>
        </div>

        <div style="overflow-x: auto;">
            <table id="habitTable">
                <thead>
                    <tr id="habitHead">
                        <th class="text-left" style="width: 250px;">CHỈ TIÊU</th>
                    </tr>
                </thead>
                <tbody id="habitBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- HÀNG DƯỚI: CHIA 2 CỘT -->
    <div class="bottom-section">
        
        <!-- Cột Trái: Thống kê -->
        <div class="stats-wrapper">
            <!-- Thống kê Tùy chỉnh -->
            <div class="panel">
                <h2>Phân Tích Dữ Liệu</h2>
                <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <span style="width: 50px; color: var(--light-charcoal);">BẮT ĐẦU:</span>
                        <input type="date" id="customStart" style="flex: 1;">
                    </div>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <span style="width: 50px; color: var(--light-charcoal);">KẾT THÚC:</span>
                        <input type="date" id="customEnd" style="flex: 1;">
                    </div>
                    <button onclick="calculateCustomStats()">TRÍCH XUẤT DỮ LIỆU</button>
                </div>
                <div id="customStatsResult">
                    <p style="color: var(--light-charcoal); text-align: center; font-style: italic;">Đang chờ lệnh nhập liệu...</p>
                </div>
            </div>

            <!-- Thống kê Tuần -->
            <div class="panel">
                <h2>Hiệu Suất Tuần</h2>
                <div class="stats-grid" id="weeklyStatsContainer"></div>
            </div>
        </div>

        <!-- Cột Phải: To-do List Mở rộng -->
        <div class="panel todo-panel">
            <h2>Hàng Đợi Nhiệm Vụ (To-Do)</h2>
            
            <div class="todo-input-group">
                <input type="text" id="todoTask" placeholder="Tên nhiệm vụ..." style="flex: 1.5;">
                <input type="text" id="todoNote" placeholder="Ghi chú dữ liệu..." style="flex: 1;">
                <button onclick="addTodo()">THÊM</button>
            </div>
            
            <div class="todo-list-container" id="todoBody">
                <!-- Các Todo Item sẽ được tạo bởi JS ở đây -->
            </div>
        </div>

    </div>
</div>

<script>
    // --- KHỞI TẠO DỮ LIỆU ---
    let currentStartOfWeek = getStartOfWeek(new Date());
    let habits = JSON.parse(localStorage.getItem('habits')) || [];
    let habitRecords = JSON.parse(localStorage.getItem('habitRecords')) || {}; 
    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    function getStartOfWeek(date) {
        let d = new Date(date);
        let day = d.getDay();
        let diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    function formatDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    function getDayName(date) {
        const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        return days[date.getDay()];
    }

    function changeWeek(offset) {
        currentStartOfWeek.setDate(currentStartOfWeek.getDate() + (offset * 7));
        renderApp();
    }

    // --- XỬ LÝ CHỈ TIÊU ---
    function addHabit() {
        const input = document.getElementById('habitInput');
        if (input.value.trim()) {
            habits.push({ id: Date.now().toString(), name: input.value.trim() });
            input.value = '';
            saveData();
            renderApp();
        }
    }

    function removeHabit(id) {
        if(confirm("Xóa bỏ dữ liệu chỉ tiêu này khỏi hệ thống?")) {
            habits = habits.filter(h => h.id !== id);
            saveData();
            renderApp();
        }
    }

    function toggleHabit(habitId, dateStr) {
        const key = `${habitId}_${dateStr}`;
        habitRecords[key] = !habitRecords[key];
        saveData();
        renderWeeklyStats();
        if(document.getElementById('customStart').value) calculateCustomStats();
    }

    // --- XỬ LÝ TO-DO LIST ---
    function addTodo() {
        const taskInput = document.getElementById('todoTask');
        const noteInput = document.getElementById('todoNote');
        if (taskInput.value.trim()) {
            todos.push({
                id: Date.now().toString(),
                task: taskInput.value.trim(),
                note: noteInput.value.trim(),
                done: false
            });
            taskInput.value = '';
            noteInput.value = '';
            saveData();
            renderTodos();
        }
    }

    function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
        if (todo) { todo.done = !todo.done; saveData(); renderTodos(); }
    }

    function removeTodo(id) {
        todos = todos.filter(t => t.id !== id);
        saveData();
        renderTodos();
    }

    function saveData() {
        localStorage.setItem('habits', JSON.stringify(habits));
        localStorage.setItem('habitRecords', JSON.stringify(habitRecords));
        localStorage.setItem('todos', JSON.stringify(todos));
    }

    // --- TÍNH TOÁN THỐNG KÊ KHOẢNG NGÀY ---
    function calculateCustomStats() {
        const startVal = document.getElementById('customStart').value;
        const endVal = document.getElementById('customEnd').value;
        const container = document.getElementById('customStatsResult');

        if (!startVal || !endVal) {
            container.innerHTML = '<p style="color: var(--light-charcoal);">[!] Thiếu tham số ngày tháng.</p>';
            return;
        }

        const startDate = new Date(startVal);
        const endDate = new Date(endVal);

        if (startDate > endDate) {
            container.innerHTML = '<p style="color: var(--light-charcoal);">[!] Lỗi logic: Ngày bắt đầu > Ngày kết thúc.</p>';
            return;
        }

        if (habits.length === 0) {
            container.innerHTML = '<p style="color: var(--light-charcoal);">Không có dữ liệu mục tiêu.</p>';
            return;
        }

        let dates = [];
        let current = new Date(startDate);
        while (current <= endDate) {
            dates.push(formatDate(current));
            current.setDate(current.getDate() + 1);
        }
        
        const totalDays = dates.length;
        let html = '';

        habits.forEach(habit => {
            let doneCount = 0;
            dates.forEach(dStr => { if (habitRecords[`${habit.id}_${dStr}`]) doneCount++; });
            let percent = Math.round((doneCount / totalDays) * 100);
            
            html += `
            <div class="progress-block">
                <div class="progress-header">
                    <span>${habit.name}</span>
                    <span style="color: var(--light-charcoal)">${percent}% [${doneCount}/${totalDays}]</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${percent}%;"></div>
                </div>
            </div>`;
        });
        
        container.innerHTML = html;
    }

    // --- RENDER GIAO DIỆN ---
    function renderApp() {
        renderCalendar();
        renderWeeklyStats();
        renderTodos();
    }

    function renderCalendar() {
        let endOfWeek = new Date(currentStartOfWeek);
        endOfWeek.setDate(currentStartOfWeek.getDate() + 6);
        document.getElementById('weekDisplay').innerText = 
            `[ ${currentStartOfWeek.toLocaleDateString('vi-VN')} - ${endOfWeek.toLocaleDateString('vi-VN')} ]`;

        const thead = document.getElementById('habitHead');
        thead.innerHTML = '<th class="text-left" style="width: 250px;">CHỈ TIÊU</th>';
        
        let weekDates = [];
        for (let i = 0; i < 7; i++) {
            let d = new Date(currentStartOfWeek);
            d.setDate(currentStartOfWeek.getDate() + i);
            weekDates.push(d);
            thead.innerHTML += `<th>${getDayName(d)}<br><small style="color: var(--light-charcoal); font-weight: normal;">${d.getDate()}/${d.getMonth()+1}</small></th>`;
        }

        const tbody = document.getElementById('habitBody');
        tbody.innerHTML = '';
        
        if (habits.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="color: var(--light-charcoal); padding: 20px;">No targets assigned.</td></tr>`;
        }

        habits.forEach(habit => {
            let tr = document.createElement('tr');
            let tdName = document.createElement('td');
            tdName.className = 'text-left';
            tdName.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-weight: 600; font-size: 1.1em;">${habit.name}</span>
                    <button class="btn-danger" onclick="removeHabit('${habit.id}')">X</button>
                </div>
            `;
            tr.appendChild(tdName);

            weekDates.forEach(date => {
                let td = document.createElement('td');
                let dateStr = formatDate(date);
                let key = `${habit.id}_${dateStr}`;
                let isChecked = habitRecords[key] ? 'checked' : '';
                td.innerHTML = `<input type="checkbox" class="retro-checkbox" ${isChecked} onchange="toggleHabit('${habit.id}', '${dateStr}')">`;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    function renderWeeklyStats() {
        const container = document.getElementById('weeklyStatsContainer');
        container.innerHTML = '';
        if (habits.length === 0) {
            container.innerHTML = '<p style="color: var(--light-charcoal);">No targets assigned.</p>';
            return;
        }

        let weekDatesStr = [];
        for (let i = 0; i < 7; i++) {
            let d = new Date(currentStartOfWeek);
            d.setDate(currentStartOfWeek.getDate() + i);
            weekDatesStr.push(formatDate(d));
        }

        habits.forEach(habit => {
            let doneCount = 0;
            weekDatesStr.forEach(dateStr => {
                if (habitRecords[`${habit.id}_${dateStr}`]) doneCount++;
            });

            let percentage = Math.round((doneCount / 7) * 100);
            
            container.innerHTML += `
                <div class="stat-item">
                    <div class="donut-chart" style="--p: ${percentage}%">
                        <span>${percentage}%</span>
                    </div>
                    <div style="font-size: 0.9em; font-weight: 600; color: var(--light-charcoal);">${habit.name}</div>
                </div>
            `;
        });
    }

    function renderTodos() {
        const container = document.getElementById('todoBody');
        container.innerHTML = '';

        if (todos.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: var(--light-charcoal); padding: 40px 0; border: 1px dashed var(--light-charcoal); border-radius: 8px;">Hàng đợi trống. Hệ thống rảnh rỗi.</div>`;
        }

        todos.forEach(todo => {
            let itemDiv = document.createElement('div');
            itemDiv.className = `todo-item ${todo.done ? 'done' : ''}`;
            
            let noteHtml = todo.note ? `<span class="todo-note">>> ${todo.note}</span>` : '';
            
            itemDiv.innerHTML = `
                <input type="checkbox" class="retro-checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo('${todo.id}')">
                <div class="todo-content">
                    <span class="todo-text">${todo.task}</span>
                    ${noteHtml}
                </div>
                <button class="btn-danger" onclick="removeTodo('${todo.id}')">DEL</button>
            `;
            container.appendChild(itemDiv);
        });
    }

    renderApp();
</script>

</body>
</html>
