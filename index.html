<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Công việc & Thói quen (Dark Theme)</title>
    <style>
        :root {
            /* Bảng màu Dark Xám */
            --primary: #52525b;       /* Xám nhấn cho nút bấm */
            --primary-hover: #71717a; /* Xám sáng hơn khi di chuột vào nút */
            --danger: #ef4444;        /* Đỏ cho nút xóa */
            --danger-hover: #f87171;
            --success: #10b981;       /* Xanh lá cho phần trăm hoàn thành */
            
            --bg: #121212;            /* Xám đen - Nền trang web */
            --card: #1e1e1e;          /* Xám đậm - Nền các thẻ nội dung */
            --text: #e5e5e5;          /* Xám trắng - Chữ chính */
            --text-muted: #9ca3af;    /* Xám mờ - Chữ phụ, ghi chú */
            
            --border: #333333;        /* Xám viền */
            --input-bg: #2d2d2d;      /* Xám nền ô nhập chữ */
            --th-bg: #2a2a2a;         /* Xám nền tiêu đề bảng */
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1, h2 { color: var(--text); }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        
        /* Bảng chung */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 12px;
            text-align: center;
        }
        th { 
            background-color: var(--th-bg); 
            color: var(--text);
        }
        .text-left { text-align: left; }
        
        /* Nút bấm & Input */
        input[type="text"] {
            padding: 8px 12px;
            background-color: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            width: 200px;
        }
        input[type="text"]::placeholder {
            color: var(--text-muted);
        }
        input[type="text"]:focus {
            border-color: #71717a;
        }
        
        button {
            padding: 8px 16px;
            background-color: var(--primary);
            color: var(--text);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
        }
        button:hover { background-color: var(--primary-hover); }
        
        button.danger { background-color: var(--danger); color: white; }
        button.danger:hover { background-color: var(--danger-hover); }
        
        /* Điều khiển tuần */
        .week-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .week-controls span { font-weight: bold; font-size: 1.1em; color: var(--text); }
        
        /* Thống kê - Biểu đồ tròn rỗng */
        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 120px;
        }
        .donut-chart {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            /* Nền của biểu đồ trên nền tối */
            background: conic-gradient(var(--success) var(--p, 0%), var(--border) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 10px;
        }
        .donut-chart::before {
            content: "";
            position: absolute;
            width: 60px;
            height: 60px;
            background: var(--card); /* Đục lỗ màu thẻ card để tạo hiệu ứng rỗng */
            border-radius: 50%;
        }
        .donut-chart span {
            position: relative;
            font-weight: bold;
            font-size: 14px;
            color: var(--text);
        }
        .stat-name {
            font-size: 0.9em;
            text-align: center;
            font-weight: 500;
        }

        /* Checkbox to */
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--success); /* Đổi màu tick sang xanh */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Quản Lý Cá Nhân</h1>

    <!-- 1. BẢNG THEO DÕI CHỈ TIÊU (HABIT TRACKER) -->
    <div class="card">
        <h2>Theo dõi chỉ tiêu tuần</h2>
        <div class="week-controls">
            <button onclick="changeWeek(-1)">&#8592; Tuần trước</button>
            <span id="weekDisplay">Tuần: ...</span>
            <button onclick="changeWeek(1)">Tuần sau &#8594;</button>
        </div>
        
        <div style="margin-bottom: 15px;">
            <input type="text" id="habitInput" placeholder="Nhập tên chỉ tiêu mới...">
            <button onclick="addHabit()">Thêm chỉ tiêu</button>
        </div>

        <div style="overflow-x: auto;">
            <table id="habitTable">
                <thead>
                    <tr id="habitHead">
                        <th class="text-left" style="width: 200px;">Chỉ tiêu</th>
                        <!-- Ngày trong tuần sẽ được JS render ở đây -->
                    </tr>
                </thead>
                <tbody id="habitBody">
                    <!-- Dữ liệu chỉ tiêu sẽ nằm ở đây -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 2. THỐNG KÊ (BIỂU ĐỒ TRÒN RỖNG) -->
    <div class="card">
        <h2>Thống kê tuần này</h2>
        <div class="stats-grid" id="statsContainer">
            <!-- Biểu đồ được JS render -->
        </div>
    </div>

    <!-- 3. DANH SÁCH VIỆC CẦN LÀM (TO-DO LIST) -->
    <div class="card">
        <h2>Việc cần làm (To-Do List)</h2>
        <div style="margin-bottom: 15px; display: flex; gap: 10px;">
            <input type="text" id="todoTask" placeholder="Việc cần làm..." style="flex: 2;">
            <input type="text" id="todoNote" placeholder="Ghi chú thêm..." style="flex: 2;">
            <button onclick="addTodo()" style="flex: 1;">Thêm việc</button>
        </div>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th class="text-left">Việc cần làm</th>
                        <th class="text-left">Ghi chú</th>
                        <th>Trạng thái</th>
                        <th>Xóa</th>
                    </tr>
                </thead>
                <tbody id="todoBody">
                    <!-- Dữ liệu To-do sẽ nằm ở đây -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- KHỞI TẠO DỮ LIỆU ---
    let currentStartOfWeek = getStartOfWeek(new Date());
    let habits = JSON.parse(localStorage.getItem('habits')) || [];
    let habitRecords = JSON.parse(localStorage.getItem('habitRecords')) || {};
    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    // --- CÁC HÀM XỬ LÝ NGÀY THÁNG ---
    function getStartOfWeek(date) {
        let d = new Date(date);
        let day = d.getDay();
        let diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    function formatDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    function getDayName(date) {
        const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        return days[date.getDay()];
    }

    function changeWeek(offset) {
        currentStartOfWeek.setDate(currentStartOfWeek.getDate() + (offset * 7));
        renderApp();
    }

    // --- HABIT TRACKER ---
    function addHabit() {
        const input = document.getElementById('habitInput');
        const name = input.value.trim();
        if (name) {
            habits.push({ id: Date.now().toString(), name: name });
            input.value = '';
            saveData();
            renderApp();
        }
    }

    function removeHabit(id) {
        if(confirm("Bạn có chắc muốn xóa chỉ tiêu này?")) {
            habits = habits.filter(h => h.id !== id);
            saveData();
            renderApp();
        }
    }

    function toggleHabit(habitId, dateStr) {
        const key = `${habitId}_${dateStr}`;
        habitRecords[key] = !habitRecords[key];
        saveData();
        renderStats();
    }

    // --- TO-DO LIST ---
    function addTodo() {
        const taskInput = document.getElementById('todoTask');
        const noteInput = document.getElementById('todoNote');
        if (taskInput.value.trim()) {
            todos.push({
                id: Date.now().toString(),
                task: taskInput.value.trim(),
                note: noteInput.value.trim(),
                done: false
            });
            taskInput.value = '';
            noteInput.value = '';
            saveData();
            renderTodos();
        }
    }

    function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
        if (todo) {
            todo.done = !todo.done;
            saveData();
            renderTodos();
        }
    }

    function removeTodo(id) {
        todos = todos.filter(t => t.id !== id);
        saveData();
        renderTodos();
    }

    // --- LƯU TRỮ ---
    function saveData() {
        localStorage.setItem('habits', JSON.stringify(habits));
        localStorage.setItem('habitRecords', JSON.stringify(habitRecords));
        localStorage.setItem('todos', JSON.stringify(todos));
    }

    // --- RENDER GIAO DIỆN ---
    function renderApp() {
        renderCalendarAndHabits();
        renderStats();
        renderTodos();
    }

    function renderCalendarAndHabits() {
        let endOfWeek = new Date(currentStartOfWeek);
        endOfWeek.setDate(currentStartOfWeek.getDate() + 6);
        document.getElementById('weekDisplay').innerText = 
            `Từ ${currentStartOfWeek.toLocaleDateString('vi-VN')} đến ${endOfWeek.toLocaleDateString('vi-VN')}`;

        const thead = document.getElementById('habitHead');
        thead.innerHTML = '<th class="text-left" style="width: 200px;">Chỉ tiêu</th>';
        
        let weekDates = [];
        for (let i = 0; i < 7; i++) {
            let d = new Date(currentStartOfWeek);
            d.setDate(currentStartOfWeek.getDate() + i);
            weekDates.push(d);
            thead.innerHTML += `<th>${getDayName(d)}<br><small style="color: var(--text-muted);">${d.getDate()}/${d.getMonth()+1}</small></th>`;
        }

        const tbody = document.getElementById('habitBody');
        tbody.innerHTML = '';
        
        if (habits.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="color: var(--text-muted);">Chưa có chỉ tiêu nào. Hãy thêm ở trên!</td></tr>`;
        }

        habits.forEach(habit => {
            let tr = document.createElement('tr');
            
            let tdName = document.createElement('td');
            tdName.className = 'text-left';
            tdName.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <strong>${habit.name}</strong>
                    <button class="danger" style="padding: 2px 6px; font-size: 12px;" onclick="removeHabit('${habit.id}')">X</button>
                </div>
            `;
            tr.appendChild(tdName);

            weekDates.forEach(date => {
                let td = document.createElement('td');
                let dateStr = formatDate(date);
                let key = `${habit.id}_${dateStr}`;
                let isChecked = habitRecords[key] ? 'checked' : '';
                
                td.innerHTML = `<input type="checkbox" ${isChecked} onchange="toggleHabit('${habit.id}', '${dateStr}')">`;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    function renderStats() {
        const container = document.getElementById('statsContainer');
        container.innerHTML = '';

        if (habits.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted);">Thêm chỉ tiêu để xem thống kê.</p>';
            return;
        }

        let weekDatesStr = [];
        for (let i = 0; i < 7; i++) {
            let d = new Date(currentStartOfWeek);
            d.setDate(currentStartOfWeek.getDate() + i);
            weekDatesStr.push(formatDate(d));
        }

        habits.forEach(habit => {
            let doneCount = 0;
            weekDatesStr.forEach(dateStr => {
                let key = `${habit.id}_${dateStr}`;
                if (habitRecords[key]) doneCount++;
            });

            let percentage = Math.round((doneCount / 7) * 100);

            let statDiv = document.createElement('div');
            statDiv.className = 'stat-item';
            
            statDiv.innerHTML = `
                <div class="donut-chart" style="--p: ${percentage}%">
                    <span>${percentage}%</span>
                </div>
                <div class="stat-name">${habit.name}</div>
                <div style="font-size: 12px; color: var(--text-muted);">${doneCount}/7 ngày</div>
            `;
            container.appendChild(statDiv);
        });
    }

    function renderTodos() {
        const tbody = document.getElementById('todoBody');
        tbody.innerHTML = '';

        if (todos.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="color: var(--text-muted);">Chưa có việc nào trong danh sách.</td></tr>`;
        }

        todos.forEach(todo => {
            let tr = document.createElement('tr');
            let textStyle = todo.done ? 'text-decoration: line-through; color: var(--text-muted);' : '';
            
            tr.innerHTML = `
                <td class="text-left" style="${textStyle}"><strong>${todo.task}</strong></td>
                <td class="text-left" style="${textStyle}">${todo.note}</td>
                <td>
                    <input type="checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo('${todo.id}')">
                </td>
                <td>
                    <button class="danger" onclick="removeTodo('${todo.id}')">Xóa</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    renderApp();
</script>

</body>
</html>
